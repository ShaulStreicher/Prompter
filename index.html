<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompter — AI Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-logo">P</div>
  <span class="header-title">Prompter</span>
  <span class="header-subtitle" id="header-subtitle">Claude · New prompt</span>
  <div class="header-actions">
    <div class="autosave-dot" id="autosave-dot" title="Auto-saved"></div>
    <button class="btn btn-ghost" id="btn-upload" title="Upload prompt file">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload
    </button>
    <button class="btn btn-ghost" id="btn-saved" title="Saved prompts">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Saved
    </button>
    <button class="btn btn-secondary" id="btn-save" title="Save current prompt">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="btn btn-ghost" id="btn-export" title="Export as .json file">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
  </div>
  <input type="file" id="file-upload-input" accept=".json" style="display:none">
</header>

<!-- ── SAVED PROMPTS MODAL ── -->
<div class="modal-overlay" id="saved-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Saved Prompts</span>
      <button class="modal-close" onclick="closeSavedModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="saved-list-container"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeSavedModal()">Close</button>
    </div>
  </div>
</div>

<!-- ── UPLOAD MODAL ── -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Upload Prompt File</span>
      <button class="modal-close" onclick="closeUploadModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="upload-zone" id="upload-zone">
        <strong>Click to choose a file, or drag &amp; drop here</strong>
        Accepts .json files exported from this app
      </div>
      <div id="upload-error" style="display:none;color:var(--danger);font-size:0.82rem;padding:8px 0;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUploadModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- ── SAVE-NAME MODAL ── -->
<div class="modal-overlay" id="savename-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span>Save Prompt</span>
      <button class="modal-close" onclick="closeSaveNameModal()">×</button>
    </div>
    <div class="modal-body">
      <label>Prompt name</label>
      <input type="text" id="save-name-input" placeholder="e.g. Customer Support Bot v2">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeSaveNameModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmSave()">Save</button>
    </div>
  </div>
</div>

<!-- ── APP LAYOUT ── -->
<div class="app-layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-header">Build Progress</div>
    <div class="sidebar-steps" id="sidebar-steps"></div>
  </nav>

  <!-- MAIN AREA -->
  <main class="main-area" id="main-area"></main>

  <!-- PREVIEW PANEL -->
  <aside class="preview-panel">
    <div class="preview-header">
      <span class="preview-title">Live Preview</span>
      <div class="preview-actions">
        <span class="copy-feedback" id="copy-feedback">Copied!</span>
        <button class="btn btn-dark btn-sm" id="btn-copy" title="Copy to clipboard">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button class="btn btn-primary btn-sm" id="btn-download" title="Download .txt">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
      </div>
    </div>
    <div class="preview-body">
      <pre id="prompt-output">Fill in the fields on the left to build your prompt…</pre>
    </div>
    <div class="preview-footer">
      <span>Tokens: <strong id="token-count">0</strong></span>
      <span>Chars: <strong id="char-count">0</strong></span>
    </div>
  </aside>

</div>

<script src="app.js"></script>
</body>
</html>
